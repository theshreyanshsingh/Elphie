name: Build and Push Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish for a manual test run. Defaults to test-<short-sha>."
        required: false
        type: string
      push_latest:
        description: "Also update :latest. Leave false for test runs."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_GHCR: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.tags.outputs.short_sha }}
      version: ${{ steps.tags.outputs.version }}
      push_latest: ${{ steps.tags.outputs.push_latest }}
      push_dockerhub: ${{ steps.tags.outputs.push_dockerhub }}
      ghcr_namespace: ${{ steps.tags.outputs.ghcr_namespace }}
    steps:
      - name: Compute tags
        id: tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"

          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#elphie-}"
            VERSION="${VERSION#v}"
            PUSH_LATEST="true"
          else
            VERSION="${{ inputs.image_tag }}"
            if [ -z "$VERSION" ]; then
              VERSION="test-${SHORT_SHA}"
            fi
            PUSH_LATEST="${{ inputs.push_latest }}"
          fi

          PUSH_DOCKERHUB="false"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            PUSH_DOCKERHUB="true"
          fi

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "push_latest=${PUSH_LATEST}" >> "$GITHUB_OUTPUT"
          echo "push_dockerhub=${PUSH_DOCKERHUB}" >> "$GITHUB_OUTPUT"
          echo "ghcr_namespace=${REGISTRY_GHCR}/${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: elphie-api
            dockerfile: api/Dockerfile
            context: .
          - name: elphie-ui
            dockerfile: ui/Dockerfile
            context: .
        platform:
          - name: linux/amd64
            runner: ubuntu-24.04
            short: amd64
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            short: arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        if: needs.prepare.outputs.push_dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Resolve image names
        id: images
        env:
          PUSH_DOCKERHUB: ${{ needs.prepare.outputs.push_dockerhub }}
          DH_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          GH_NAMESPACE: ${{ needs.prepare.outputs.ghcr_namespace }}
          SERVICE: ${{ matrix.service.name }}
        run: |
          names="${GH_NAMESPACE}/${SERVICE}"
          if [ "$PUSH_DOCKERHUB" = "true" ] && [ -n "$DH_NAMESPACE" ]; then
            names="${DH_NAMESPACE}/${SERVICE},${names}"
          fi
          echo "outputs=type=image,\"name=${names}\",push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          outputs: ${{ steps.images.outputs.outputs }}
          cache-from: type=gha,scope=${{ matrix.service.name }}-${{ matrix.platform.short }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-${{ matrix.platform.short }}

      - name: Export digest
        run: |
          mkdir -p "/tmp/digests/${{ matrix.service.name }}"
          echo "${{ steps.build.outputs.digest }}" | sed 's/^sha256://' > "/tmp/digests/${{ matrix.service.name }}/${{ matrix.platform.short }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service.name }}-${{ matrix.platform.short }}
          path: /tmp/digests/${{ matrix.service.name }}/${{ matrix.platform.short }}
          retention-days: 1

  merge:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download API digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-elphie-api-*
          merge-multiple: true
          path: /tmp/digests/elphie-api

      - name: Download UI digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-elphie-ui-*
          merge-multiple: true
          path: /tmp/digests/elphie-ui

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        if: needs.prepare.outputs.push_dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Create manifest lists
        env:
          DH_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          GH_NAMESPACE: ${{ needs.prepare.outputs.ghcr_namespace }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          PUSH_LATEST: ${{ needs.prepare.outputs.push_latest }}
          PUSH_DOCKERHUB: ${{ needs.prepare.outputs.push_dockerhub }}
        run: |
          inspect_digests() {
            service="$1"
            digest_dir="/tmp/digests/$service"
            gh_image="$GH_NAMESPACE/$service"

            for digest_file in "$digest_dir"/*; do
              digest="$(cat "$digest_file")"
              if [ "$PUSH_DOCKERHUB" = "true" ]; then
                docker buildx imagetools inspect "$DH_NAMESPACE/$service@sha256:$digest" >/dev/null
              fi
              docker buildx imagetools inspect "$gh_image@sha256:$digest" >/dev/null
            done
          }

          create_manifests() {
            service="$1"
            digest_dir="/tmp/digests/$service"
            gh_image="$GH_NAMESPACE/$service"

            gh_refs=$(printf "${gh_image}@sha256:%s " $(cat "$digest_dir"/*))
            gh_tags=(-t "$gh_image:$VERSION" -t "$gh_image:$SHORT_SHA")
            if [ "$PUSH_LATEST" = "true" ]; then
              gh_tags+=(-t "$gh_image:latest")
            fi
            docker buildx imagetools create "${gh_tags[@]}" $gh_refs

            if [ "$PUSH_DOCKERHUB" = "true" ]; then
              dh_image="$DH_NAMESPACE/$service"
              dh_refs=$(printf "${dh_image}@sha256:%s " $(cat "$digest_dir"/*))
              dh_tags=(-t "$dh_image:$VERSION" -t "$dh_image:$SHORT_SHA")
              if [ "$PUSH_LATEST" = "true" ]; then
                dh_tags+=(-t "$dh_image:latest")
              fi
              docker buildx imagetools create "${dh_tags[@]}" $dh_refs
            fi
          }

          inspect_digests elphie-api
          inspect_digests elphie-ui
          create_manifests elphie-api
          create_manifests elphie-ui
